            { q: "The magnetic field of Earth points from...", q_ar: "المجال المغناطيسي للأرض يشير من...", opts: ["North to South", "South to North", "East to West", "West to East"], opts_ar: ["الشمال للجنوب", "الجنوب للشمال", "الشرق للغرب", "الغرب للشرق"], ans: 1, exp: "Geographic South to Geographic North.", exp_ar: "من الجنوب الجغرافي إلى الشمال الجغرافي." },

            finalExam.push({...baseQuestions[i % baseQuestions.length], q: baseQuestions[i % baseQuestions.length].q + ` (${finalExam.length})`});

        }

                </div>

                {/* Problem Section */}
                <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-md border border-slate-200 dark:border-slate-700 p-6">
                    <h3 className="text-lg font-bold mb-4 flex items-center gap-2">
                        <i className="fas fa-calculator text-secondary"></i> {t('practiceProblem')}
                    </h3>
                    
                    <div className="space-y-2 mb-4 p-4 bg-slate-50 dark:bg-slate-900 rounded-xl">
                        <p className="text-slate-700 dark:text-slate-300 bilingual-text font-bold">{law.problem.q_en}</p>
                        <p className="text-slate-700 dark:text-slate-300 arabic-text font-semibold">{law.problem.q_ar}</p>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div className="bg-slate-50 dark:bg-slate-900 p-3 rounded-lg border border-slate-100 dark:border-slate-700">
                            <span className="text-sm text-slate-500 font-bold block mb-1">{t('given')}</span>
                            <p className="font-mono text-sm">{law.problem.given}</p>
                        </div>
                        <div className="bg-slate-50 dark:bg-slate-900 p-3 rounded-lg border border-slate-100 dark:border-slate-700">
                            <span className="text-sm text-slate-500 font-bold block mb-1">{t('required')}</span>
                            <p className="font-mono text-sm">{law.problem.required}</p>
                        </div>
                    </div>

                    {!showSolution ? (
                        <button onClick={() => setShowSolution(true)} className="w-full py-3 bg-secondary text-white rounded-xl font-bold hover:bg-emerald-600 transition">
                            {t('showSolution')}
                        </button>
                    ) : (
                        <div className="bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 p-4 rounded-xl">
                            <span className="font-bold text-emerald-700 dark:text-emerald-500 block mb-2">{t('solution')}</span>
                            <p className="font-mono text-emerald-800 dark:text-emerald-300 text-lg">{law.problem.solution}</p>
                        </div>
                    )}
                </div>

                <div className="flex justify-between mt-6">
                    <button 
                        disabled={current === 0}
                        onClick={() => { setCurrent(p => p - 1); setShowSolution(false); }}
                        className="px-6 py-3 bg-slate-200 dark:bg-slate-700 rounded-xl font-bold disabled:opacity-50"
                    >
                        {t('prev')}
                    </button>
                    <button 
                        disabled={current === lawsData.length - 1}
                        onClick={() => { setCurrent(p => p + 1); setShowSolution(false); }}
                        className="px-6 py-3 bg-primary text-white rounded-xl font-bold disabled:opacity-50"
                    >
                        {t('next')}
                    </button>
                </div>
            </div>
        );
    };

    const Exam = ({ t, setProgress }) => {
        const [currentQ, setCurrentQ] = useState(0);
        const [selected, setSelected] = useState(null);
        const [submitted, setSubmitted] = useState(false);
        const [score, setScore] = useState(0);
        const [showResult, setShowResult] = useState(false);
        const [answers, setAnswers] = useState([]);

        const q = examData[currentQ];

        const handleSubmit = () => {
            if (selected === null) return;
            setSubmitted(true);
            if (selected === q.ans) setScore(s => s + 1);
            setAnswers([...answers, { q: currentQ, selected, correct: q.ans }]);
        };

        const handleNext = () => {
            if (currentQ < examData.length - 1) {
                setCurrentQ(currentQ + 1);
                setSelected(null);
                setSubmitted(false);
            } else {
                setShowResult(true);
                const finalScore = Math.round(((score + (selected === q.ans ? 1 : 0)) / examData.length) * 100);
                setProgress(p => ({...p, lastExam: finalScore, overall: Math.min(100, p.overall + 10)}));
            }
        };

        const retake = () => {
            setCurrentQ(0);
            setSelected(null);
            setSubmitted(false);
            setScore(0);
            setShowResult(false);
            setAnswers([]);
        };

        if (showResult) {
            const percentage = Math.round((score / examData.length) * 100);
            const wrongAnswers = answers.filter(a => a.selected !== a.correct);

            return (
                <div className="p-6 max-w-3xl mx-auto">
                    <div className="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-lg border border-slate-200 dark:border-slate-700 text-center mb-6">
                        <h2 className="text-3xl font-bold mb-4">{t('examResult')}</h2>
                        <div className="text-6xl font-bold text-primary mb-6">{percentage}%</div>
                        <div className="flex justify-center gap-8 mb-6">
                            <p className="text-lg">{t('correctAnswers')}: <span className="text-emerald-500 font-bold">{score}</span></p>
                            <p className="text-lg">{t('wrongAnswers')}: <span className="text-red-500 font-bold">{examData.length - score}</span></p>
                        </div>
                        <button onClick={retake} className="px-8 py-3 bg-primary text-white rounded-xl font-bold hover:bg-indigo-600 transition">
                            {t('retakeExam')}
                        </button>
                    </div>

                    {wrongAnswers.length > 0 && (
                        <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-200 dark:border-slate-700">
                            <h3 className="text-xl font-bold mb-4 text-red-500 border-b pb-2">{t('reviewMistakes')}</h3>
                            <div className="space-y-4">
                                {wrongAnswers.map((ans, idx) => {
                                    const questionData = examData[ans.q];
                                    return (
                                        <div key={idx} className="p-4 bg-red-50 dark:bg-red-900/10 rounded-lg border border-red-100 dark:border-red-900/30">
                                            <p className="font-bold mb-1 bilingual-text">{questionData.q}</p>
                                            <p className="font-bold mb-3 arabic-text text-sm text-slate-600 dark:text-slate-400">{questionData.q_ar}</p>
                                            
                                            <p className="text-sm text-red-500 mb-1">{t('yourAnswer')}: <span className="font-semibold">{questionData.opts[ans.selected]}</span> ({questionData.opts_ar[ans.selected]})</p>
                                            <p className="text-sm text-emerald-600 dark:text-emerald-400 font-bold">{t('correctAnswer')}: <span className="font-semibold">{questionData.opts[questionData.ans]}</span> ({questionData.opts_ar[questionData.ans]})</p>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        return (
            <div className="p-6 max-w-3xl mx-auto">
                <div className="mb-6">
                    <div className="flex justify-between text-sm mb-2 text-slate-500 font-semibold">
                        <span>{t('examProgress')}</span>
                        <span>{currentQ + 1} / {examData.length}</span>
                    </div>
                    <div className="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2">
                        <div className="bg-primary rounded-full h-2 transition-all" style={{ width: `${((currentQ + 1) / examData.length) * 100}%` }}></div>
                    </div>
                </div>

                <div className="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-md border border-slate-200 dark:border-slate-700">
                    <div className="mb-6 border-b pb-4 dark:border-slate-700">
                        <h3 className="text-xl font-bold mb-2 bilingual-text">{q.q}</h3>
                        <h3 className="text-lg font-semibold arabic-text text-primary">{q.q_ar}</h3>
                    </div>

                    <div className="space-y-3 mb-6">
                        {q.opts.map((opt, idx) => (
                            <button
                                key={idx}
                                disabled={submitted}
                                onClick={() => setSelected(idx)}
                                className={`w-full p-4 rounded-xl border-2 transition-all flex flex-col md:flex-row justify-between items-start md:items-center gap-2 ${
                                    selected === idx ? 'border-primary bg-indigo-50 dark:bg-indigo-900/20' : 'border-slate-200 dark:border-slate-700 hover:border-primary/50'
                                } ${submitted && idx === q.ans ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-900/20' : ''} ${
                                    submitted && selected === idx && selected !== q.ans ? 'border-red-500 bg-red-50 dark:bg-red-900/20' : ''
                                }`}
                            >
                                <div className="flex flex-col items-start">
                                    <span className="bilingual-text font-semibold">{opt}</span>
                                    <span className="arabic-text text-sm text-slate-500 mt-1">{q.opts_ar ? q.opts_ar[idx] : ''}</span>
                                </div>
                                <div className="flex-shrink-0">
                                    {submitted && idx === q.ans && <i className="fas fa-check-circle text-emerald-500 text-xl"></i>}
                                    {submitted && selected === idx && selected !== q.ans && <i className="fas fa-times-circle text-red-500 text-xl"></i>}
                                </div>
                            </button>
                        ))}
                    </div>

                    {submitted && (
                        <div className={`p-4 rounded-xl mb-6 ${selected === q.ans ? 'bg-emerald-50 dark:bg-emerald-900/20 text-emerald-800 dark:text-emerald-300' : 'bg-red-50 dark:bg-red-900/20 text-red-800 dark:text-red-300'}`}>
                            <p className="font-bold mb-1">{selected === q.ans ? t('correct') : t('incorrect')}</p>
                            <p className="text-sm bilingual-text">{q.exp}</p>
                            <p className="text-sm arabic-text font-semibold mt-1">{q.exp_ar}</p>
                        </div>
                    )}

                    {!submitted ? (
                        <button 
                            onClick={handleSubmit} 
                            disabled={selected === null}
                            className="w-full py-3 bg-primary text-white rounded-xl font-bold hover:bg-indigo-600 transition disabled:opacity-50"
                        >
                            {t('submitAnswer')}
                        </button>
                    ) : (
                        <button 
                            onClick={handleNext}
                            className="w-full py-3 bg-secondary text-white rounded-xl font-bold hover:bg-emerald-600 transition"
                        >
                            {currentQ === examData.length - 1 ? t('finishExam') : t('nextQuestion')}
                        </button>
                    )}
                </div>
            </div>
        );
    };

    // ==========================================
    // 3. MAIN APP
    // ==========================================

    const App = () => {
        const [activeTab, setActiveTab] = useState('dashboard');
        const [lang, setLang] = useState('ar'); // Controls UI Language
        const [theme, setTheme] = useState('light');
        
        // Load Progress
        const [progress, setProgress] = useState(() => {
            try {
                const saved = localStorage.getItem('physicsProgress');
                return saved ? JSON.parse(saved) : { sections: 0, cards: 0, laws: 0, lastExam: null, overall: 0 };
            } catch(e) {
                return { sections: 0, cards: 0, laws: 0, lastExam: null, overall: 0 };
            }
        });

        // Save Progress
        useEffect(() => {
            localStorage.setItem('physicsProgress', JSON.stringify(progress));
        }, [progress]);

        // Handle Theme
        useEffect(() => {
            if (theme === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        }, [theme]);

        // Handle UI Language
        useEffect(() => {
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
        }, [lang]);

        // UI Translation Dictionary
        const t = (key) => {
            const dict = {
                ar: {
                    appName: 'فيزياء 100', dashboard: 'لوحة التحكم', summary: 'ملخص المنهج', flashcards: 'الفلاش كاردز', 
                    points: 'النقاط المهمة', laws: 'القوانين والمسائل', exam: 'الاختبار النهائي',
                    welcome: 'مرحباً بك في منصة الفيزياء', welcomeDesc: 'استعد لامتحانك بأفضل طريقة تفاعلية.',
                    overallProgress: 'نسبة الإنجاز الإجمالية', studiedSections: 'الأجزاء المدروسة', reviewedCards: 'الفلاش كاردز المُراجعة',
                    learnedLaws: 'القوانين المتعلمة', lastExam: 'نتيجة آخر اختبار', noExam: 'لم يحدد',
                    resetProgress: 'إعادة ضبط التقدم', prev: 'السابق', next: 'التالي', 
                    cardProgress: 'تقدم الفلاش كاردز', question: 'السؤال', answer: 'الإجابة', clickToReveal: 'اضغط لكشف الإجابة', gotIt: 'تم المراجعة',
                    importantPointsTitle: 'أهم النقاط في المنهج', lawsTitle: 'القوانين والمسائل التفاعلية', symbols: 'الرموز:', usage: 'متى نستخدمه:', note: 'ملاحظة مهمة:',
                    practiceProblem: 'مسألة تطبيقية', given: 'المعطيات:', required: 'المطلوب:', showSolution: 'إظهار الحل', solution: 'الحل:',
                    examProgress: 'تقدم الاختبار', submitAnswer: 'تأكيد الإجابة', nextQuestion: 'السؤال التالي', finishExam: 'إنهاء الاختبار',
                    correct: 'إجابة صحيحة!', incorrect: 'إجابة خاطئة', examResult: 'نتيجة الاختبار', correctAnswers: 'إجابات صحيحة', wrongAnswers: 'إجابات خاطئة', retakeExam: 'إعادة الاختبار',
                    reviewMistakes: 'مراجعة الأخطاء', yourAnswer: 'إجابتك', correctAnswer: 'الإجابة الصحيحة'
                },
                en: {
                    appName: 'Physics 100', dashboard: 'Dashboard', summary: 'Summary', flashcards: 'Flashcards', 
                    points: 'Important Points', laws: 'Laws & Problems', exam: 'Final Exam',
                    welcome: 'Welcome to Physics Platform', welcomeDesc: 'Prepare for your exam in the best interactive way.',
                    overallProgress: 'Overall Progress', studiedSections: 'Studied Sections', reviewedCards: 'Reviewed Cards',
                    learnedLaws: 'Learned Laws', lastExam: 'Last Exam Score', noExam: 'N/A',
                    resetProgress: 'Reset Progress', prev: 'Previous', next: 'Next', 
                    cardProgress: 'Flashcard Progress', question: 'Question', answer: 'Answer', clickToReveal: 'Click to reveal answer', gotIt: 'Got it',
                    importantPointsTitle: 'Important Points Summary', lawsTitle: 'Interactive Laws & Problems', symbols: 'Symbols:', usage: 'When to use:', note: 'Important Note:',
                    practiceProblem: 'Practice Problem', given: 'Given:', required: 'Required:', showSolution: 'Show Solution', solution: 'Solution:',
                    examProgress: 'Exam Progress', submitAnswer: 'Submit Answer', nextQuestion: 'Next Question', finishExam: 'Finish Exam',
                    correct: 'Correct Answer!', incorrect: 'Incorrect Answer', examResult: 'Exam Result', correctAnswers: 'Correct Answers', wrongAnswers: 'Wrong Answers', retakeExam: 'Retake Exam',
                    reviewMistakes: 'Review Mistakes', yourAnswer: 'Your Answer', correctAnswer: 'Correct Answer'
                }
            };
            return dict[lang][key] || key;
        };

        const renderContent = () => {
            switch(activeTab) {
                case 'dashboard': return <Dashboard t={t} progress={progress} resetProgress={() => { localStorage.removeItem('physicsProgress'); window.location.reload(); }} />;
                case 'summary': return <Summary t={t} setProgress={setProgress} />;
                case 'flashcards': return <Flashcards t={t} setProgress={setProgress} />;
                case 'points': return <Points t={t} />;
                case 'laws': return <Laws t={t} setProgress={setProgress} />;
                case 'exam': return <Exam t={t} setProgress={setProgress} />;
                default: return <Dashboard t={t} progress={progress} />;
            }
        };

        return (
            <div className="flex flex-col md:flex-row min-h-screen bg-slate-50 dark:bg-slate-900 transition-colors">
                <Sidebar 
                    activeTab={activeTab} 
                    setActiveTab={setActiveTab} 
                    t={t} 
                    lang={lang} 
                    toggleLang={() => setLang(l => l === 'ar' ? 'en' : 'ar')}
                    theme={theme}
                    toggleTheme={() => setTheme(th => th === 'light' ? 'dark' : 'light')}
                />
                <main className="flex-1 overflow-y-auto h-screen pb-20 md:pb-0 relative">
                    {renderContent()}
                </main>
                
                {/* Mobile Bottom Navigation */}
                <div className="md:hidden fixed bottom-0 w-full bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 flex justify-around py-2 z-50">
                    {[
                        { id: 'dashboard', icon: 'fa-chart-pie' },
                        { id: 'summary', icon: 'fa-book-open' },
                        { id: 'flashcards', icon: 'fa-clone' },
                        { id: 'laws', icon: 'fa-calculator' },
                        { id: 'exam', icon: 'fa-graduation-cap' }
                    ].map(item => (
                        <button key={item.id} onClick={() => setActiveTab(item.id)} className={`p-2 rounded-lg text-lg ${activeTab === item.id ? 'text-primary' : 'text-slate-400'}`}>
                            <i className={`fas ${item.icon}`}></i>
                        </button>
                    ))}
                </div>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>

</body>
</html>
